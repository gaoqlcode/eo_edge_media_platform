http:
  routers:
    - rule: "PathPrefix(`/api/devices`) || PathPrefix(`/api/sessions`) || PathPrefix(`/api/assets`) || PathPrefix(`/api/alarms`) || PathPrefix(`/api/bff`) || PathPrefix(`/health`) || PathPrefix(`/metrics`)"
      service: bff_and_split
      entryPoints:
        - web

  services:
    # 简化：先把管理流量转到 BFF；细路由可再拆
    bff_and_split:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:8105"
